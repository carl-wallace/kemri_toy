[package]
name = "kemri_toy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
# ASN.1 encoding/decoding and related support from RustCrypto community
base64ct = { version="1.8.3", features = ["alloc"] }
cms = { version = "0.3.0-pre.2", features = ["builder"] }
const-oid = { version = "0.10.2", default-features = false, features = ["db"] }
der = { version="0.8.1", features = ["alloc", "derive", "flagset", "oid"] }
spki = { version = "0.8.0", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["hazmat", "builder"] }

certval = { version = "0.2.0-rc.1", features = ["std", "rsa", "pqc"] }
pqckeys = { git = "https://github.com/carl-wallace/pqckeys", branch = "main", features = ["pem"] }

# cryptography-related crates
aes = { version = "0.9.1" }
aes-gcm = { version = "0.11.0" , features = ["arrayvec"]}
aes-kw ="0.3.1"
cbc = { version = "0.2.1" }
cipher = { version = "0.5.2", features = ["alloc", "block-padding", "rand_core"] }
ecdsa = {version = "0.17.0", default-features = false, features = ["der", "pkcs8"]}
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "pkcs8", "rand_core"] }
ed448-goldilocks = {version = "0.14.0-pre.15", default-features = false}
elliptic-curve = {version = "0.14.1", default-features = false, features = ["sec1", "pkcs8"]}
fn-dsa = { version = "0.3.0" }
# FN-DSA (Falcon) verify-only crate, used by misc::fndsa_verify to register a Falcon
# signature-verification callback on certval's PkiEnvironment (pre-standard, kept out of certval).
fn-dsa-vrfy = { version = "0.3.0" }
hkdf = "0.13.0"
hmac = "0.13.0"
kem = { version = "0.3.0", features = ["getrandom"] }
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2" }
p256 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
p384 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
p521 = {version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"]}
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha2 = "0.11.0"
sha3 = "0.11.0"
signature = { version = "3.0.0", features = ["digest", "alloc"]}
slh-dsa = "0.2.0-rc.5"
tari-tiny-keccak = { version = "2.0.2", features = ["kmac"] }

# utility crates
clap = {version = "4.6.2", features = ["std", "derive"] }
colored = "3.1.1"
hex-literal = "1.1.0"
lazy_static = "1.5.0"
log = "0.4.33"
log4rs = "1.4.0"
rand = "0.10.2"
rand_core = { version = "0.10.1"}
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
subtle-encoding = {version = "0.5.1", default-features = false, features = ["hex", "alloc"]}
tokio = { version = "1.52.4", features = ["full", "time", "rt-multi-thread"]}
zerocopy = "0.8.54"

[patch.crates-io]
cms           = { git = "https://github.com/RustCrypto/formats.git" }


